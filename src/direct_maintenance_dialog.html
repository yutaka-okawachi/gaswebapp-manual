<!doctype html><html lang="ja"><head><base target="_top"><meta charset="utf-8"><style>body{font:15px/1.6 sans-serif;padding:18px;color:#202124}input,select,textarea,button{font:inherit;margin:5px 0;padding:8px;box-sizing:border-box}input,select,textarea{width:100%}button{cursor:pointer;background:#174ea6;color:white;border:0;border-radius:4px;margin-right:8px}button:disabled{opacity:.5;cursor:wait}textarea{min-height:170px}pre{white-space:pre-wrap;background:#f4f6f8;padding:12px}#message{white-space:pre-wrap}label{display:block}details{margin:12px 0}.secondary{background:#5f6368}</style></head><body>
<h2>用語を調べて登録</h2><label for="term">調べる語</label><input id="term" maxlength="120" placeholder="例：grosser"><button id="inspect">調べる</button><button id="fill" class="secondary">選択行の空欄補完</button><p id="message" role="status"></p><main id="result"></main><button id="close" class="secondary">閉じる</button>
<script>
'use strict';const $=id=>document.getElementById(id);let busy=false,closed=false,seq=0,current=null;
function add(parent,tag,value){const e=document.createElement(tag);e.textContent=value||'';parent.appendChild(e);return e;}
function controls(){document.querySelectorAll('button,input,select,textarea').forEach(e=>{if(e.id!=='close')e.disabled=busy;});}
function message(t){$('message').textContent=t;}
function rpc(method,args,done){if(busy||closed)return;const own=++seq;busy=true;controls();message('処理中です．');const fail=e=>{if(closed||own!==seq)return;busy=false;controls();message((e&&e.message?e.message:'処理結果を確認できませんでした．')+'\n保存操作の後なら「調べる」で現在の登録を確認できます．自動再送はしません．');};try{const runner=google.script.run.withSuccessHandler(r=>{if(closed||own!==seq)return;busy=false;controls();try{done(r);}catch(e){fail(e);}}).withFailureHandler(fail);runner[method](...args);}catch(e){fail(e);}}
function select(parent,id,label,options){add(parent,'label',label);const e=document.createElement('select');e.id=id;options.forEach(([value,text])=>{const o=add(e,'option',text);o.value=value;});parent.appendChild(e);return e;}
function render(s){current=s;$('result').replaceChildren();message('現在のNotesと語形対応を確認しました．');const root=$('result');add(root,'h3',s.term);
 if(s.notes.length){add(root,'p','Notes登録済み：'+s.notes.map(n=>n.headword+'（'+n.number+'行）').join('，'));const edit=add(root,'button','この項目を編集');edit.onclick=()=>rpc('directMaintenanceEntry',[s.term],d=>renderDraft(d,true));return;}
 if(s.mappings.length){add(root,'p','語形対応は登録済みです．');add(root,'pre',s.mappings.map(r=>r[1]+' → '+r[0]+' ／ '+r[2]).join('\n'));return;}
 add(root,'p','未登録です．関連する見出しに語形を追加するか，新しいNotes項目を作成できます．');
 const proof=add(root,'details','');add(proof,'summary','実例と出典');add(proof,'pre',s.source?s.source.proof.map(p=>p.tab+' '+p.location+'\n'+p.german).join('\n\n'):s.sourceError);
 let suggestedHead=s.candidates[0]?.headword||'',suggestedCategory='INFLECTION';
 const advice=add(root,'button','Jevに判定を頼む（API利用）');const adviceResult=add(root,'p','');
 add(root,'p','処理方法を選んでください．Jevの助言だけでは処理は決まりません．');
 const aliasChoice=add(root,'button','語形対応として処理');const notesChoice=add(root,'button','新規項目として登録');const branch=add(root,'div','');
 function choose(kind){branch.replaceChildren();aliasChoice.className=kind==='alias'?'':'secondary';notesChoice.className=kind==='notes'?'':'secondary';if(kind==='alias')renderAlias();else{add(branch,'h3','新しいNotes項目を作成');const draft=add(branch,'button','日英の草案を作る（API利用）');draft.onclick=()=>rpc('directMaintenanceDraft',[s.term],renderDraft);message('新規項目を選びました．日英の草案を作成できます．');}}
 aliasChoice.className=notesChoice.className='secondary';aliasChoice.onclick=()=>choose('alias');notesChoice.onclick=()=>choose('notes');
 advice.onclick=()=>rpc('directMaintenanceAdvice',[s.term],a=>{adviceResult.textContent='Jevの助言：'+a.category+(a.headword?' → '+a.headword:'')+'．処理方法を選んでください．';if(a.headword&&s.headwords.includes(a.headword))suggestedHead=a.headword;if(['INFLECTION','ORTHOGRAPHIC_VARIANT','TYPO'].includes(a.category))suggestedCategory=a.category;branch.replaceChildren();aliasChoice.className=notesChoice.className='secondary';message('Jevの助言を確認し，語形対応か新規項目かを選んでください．');});
 function renderAlias(){
 add(branch,'h3','語形対応に追加');const candidates=s.candidates.map(c=>c.headword),heads=[...new Set([...candidates,...s.headwords])];const head=select(branch,'head','対応する単語見出し',[['','選択してください'],...heads.map(h=>[h,h])]);head.value=suggestedHead;
 const category=select(branch,'category','語形区分',[['INFLECTION','語形変化'],['ORTHOGRAPHIC_VARIANT','別綴り'],['TYPO','誤記候補']]);category.value=suggestedCategory;
 const preview=add(branch,'div','');function invalidate(){suggestedHead=head.value;suggestedCategory=category.value;preview.replaceChildren();if(head.value)loadPreview();}head.onchange=invalidate;category.onchange=invalidate;
 function loadPreview(){rpc('directMaintenanceAliasPreview',[s.term,head.value,category.value],p=>{preview.replaceChildren();add(preview,'pre',p.term+' → '+p.headword+'\n'+p.mappingCategory+'\n用語検索・実例検索：対象'+(p.missing.length?'\n見出しの出典に追加：'+p.missing.join('，'):''));if(p.existing.length){add(preview,'p','登録済みです．');return;}const save=add(preview,'button','この語形対応を登録');save.onclick=()=>rpc('directMaintenanceAliasSave',[p.term,p.headword,p.category,p.signature],r=>{preview.replaceChildren();message(r.message);add(preview,'p','登録完了');});message('表示した対応でよければ，登録ボタンを押してください．');});}
 message('語形対応を選びました．対応する単語見出しを確認してください．');invalidate();
 }

}
function renderDraft(d,editing=false){$('result').replaceChildren();const root=$('result');add(root,'h3',editing?'既存Notesの編集':'Notes登録前の編集');add(root,'p','日英本文を確認・編集して保存してください．');for(const [key,label] of [['de','見出し'],['source','出典'],['ja','日本語'],['en','英語']]){add(root,'label',label);const e=document.createElement(key==='ja'||key==='en'?'textarea':'input');e.id='draft_'+key;e.value=d[key]||'';if(key==='de'||key==='source')e.readOnly=true;root.appendChild(e);}if(Array.isArray(d.warnings)&&d.warnings.length)add(root,'pre',d.warnings.join('\n'));renderLinks(root,d.linkAdvisory);const save=add(root,'button',editing?'変更を保存':'Notesに登録');save.onclick=()=>{const fields={ja:$('draft_ja').value,en:$('draft_en').value};rpc(editing?'directMaintenanceEdit':'directMaintenanceNotesSave',editing?[d.de,d.signature,fields]:[d.de,fields],r=>{if(!r||!['saved','existing'].includes(r.status))throw Error('保存結果を読み取れません．');if(r.status==='existing'){message(r.term+' は既にNotesにあります（'+r.row+'行）．重複登録していません．入力案は画面に残しています．');return;}message(r.term+' を保存しました（Notes '+r.row+'行）．公開反映はsync-dataで行います．');root.replaceChildren();});};message(editing?'本文の編集画面です．まだ変更していません．':'草案を作成しました．まだNotesには登録していません．');}
function renderLinks(root,a){const details=add(root,'details','');add(details,'summary','英語の誤リンクを防ぐには');add(details,'p','英語の see・kind・also などをドイツ語見出しへリンクしないようにします．公開表示も確認してください．');if(a&&a.status==='ready'){add(details,'p','英語本文のリンク候補：'+a.candidateCount+'か所');for(const c of a.candidates||[])add(details,'pre',c.label+' → '+c.target+'（'+c.count+'か所）'+String.fromCharCode(10)+c.context);}else add(details,'p','リンク候補は今回確認していません．');}
$('inspect').onclick=()=>rpc('directMaintenanceInspect',[$('term').value],render);$('term').onkeydown=e=>{if(e.key==='Enter')$('inspect').click();};$('fill').onclick=()=>rpc('showMaintenanceSelectedRows',[],()=>message('選択行の空欄補完画面へ進みます．'));$('close').onclick=()=>{closed=true;seq++;google.script.host.close();};window.addEventListener('pagehide',()=>{closed=true;seq++;});
</script></body></html>
