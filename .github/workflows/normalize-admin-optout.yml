name: Normalize admin opt-out bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-admin-optout.yml'
      - 'scripts/normalize-admin-optout.js'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize analytics bootstrap order
        run: node scripts/normalize-admin-optout.js

      - name: Validate JavaScript syntax
        run: |
          node --check scripts/normalize-admin-optout.js
          node --check mahler-search-app/js/analytics.js
          node --check src/generate_dic_html.js

      - name: Commit normalized files
        run: |
          if git diff --quiet; then
            echo "No normalization changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html mahler-search-app src/generate_dic_html.js
          git commit -m "Ensure admin opt-out loads before GA4"
          git push
