name: Validate site and sync

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and check reproducibility
        run: |
          node scripts/build-site.js
          node -e "require('./scripts/sync/gas').prepareBuild()"
          git diff --exit-code
      - name: Run local regressions
        run: node scripts/check-local.js
