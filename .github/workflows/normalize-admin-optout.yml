name: Validate site and sync

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and check reproducibility
        run: |
          node scripts/build-site.js
          node -e "require('./scripts/sync/gas').prepareBuild()"
          git diff --exit-code
      - name: Run local regressions
        run: node scripts/check-local.js

  package-pages:
    name: Package verified Pages
    if: vars.VERIFIED_PAGES == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check public file hashes in built site
        run: node scripts/verify-pages-artifact.js _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy-pages:
    name: Deploy verified Pages
    needs: package-pages
    runs-on: ubuntu-latest
    concurrency:
      group: verified-pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse to deploy a superseded commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$latest" = "$GITHUB_SHA"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
